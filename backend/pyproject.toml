[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-daily-roast-ai"
version = "0.1.0"
description = "Evidence-Driven Market Intelligence — paper trading research platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.3.4",
    "google-genai>=1.0.0",
    "polars>=0.19.0,!=1.43.1",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "colorama==0.4.6; sys_platform == 'win32'",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.0.0",
    "bandit>=1.7.0",
    "httpx>=0.27.0",
    "pip-audit>=2.0.0",
    "pip-tools>=7.0.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "SIM"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "database: requires a running local Supabase PostgreSQL database",
]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--basetemp=.pytest-tmp",
    "-o",
    "cache_dir=.pytest-cache",
    "--cov=app",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.setuptools.packages.find]
where = ["."]