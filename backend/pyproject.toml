<arg_value>[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-daily-roast-ai"
version = "0.1.0"
description = "Evidence-Driven Market Intelligence — paper trading research platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "google-genai>=1.0.0",
    "polars>=0.19.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "hypothesis>=6.0.0",
    "bandit>=1.7.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W", "B", "C4", "SIM"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["backend"]