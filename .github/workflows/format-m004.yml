name: Format M004 frontend

on:
  push:
    branches:
      - feat/m004-frontend-foundation

permissions:
  contents: write

jobs:
  format-and-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out M004 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/m004-frontend-foundation

      - name: Set up locked Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Refresh lockfile and format frontend test
        run: |
          npm install --prefix frontend --package-lock-only --ignore-scripts
          npm ci --prefix frontend
          npx --prefix frontend prettier --write frontend/src/tests/app.test.tsx

      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet -- frontend/package-lock.json frontend/src/tests/app.test.tsx; then
            echo "No generated changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json frontend/src/tests/app.test.tsx
          git commit -m "style(m004): format frontend tests and refresh lockfile"
          git push origin HEAD:feat/m004-frontend-foundation
