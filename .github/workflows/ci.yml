name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-lint-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install -e ".[dev]" -r requirements.txt
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Format
        run: make format
      - name: Lint
        run: make lint
      - name: Type check
        run: make type-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install -e ".[dev]" -r requirements.txt
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Run tests
        run: make test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Type check
        run: make type-check
      - name: Lint
        run: make lint
      - name: Build
        run: make frontend-build
      - name: Frontend test
        run: make frontend-test

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check README structure matches implementation
        run: make docs-check

  windows-commands:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Command help
        run: .\tasks.ps1 help
      - name: Docs check
        run: .\tasks.ps1 docs-check
      - name: Lint
        run: .\tasks.ps1 lint
      - name: Type check
        run: .\tasks.ps1 type-check
      - name: Research cycle smoke
        run: .\tasks.ps1 research-cycle