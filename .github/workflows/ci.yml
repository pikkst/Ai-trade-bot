name: Baseline CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AI_PROVIDER: fake
  GEMINI_ENABLED: "false"
  ALLOW_PAID_PROVIDER_USAGE: "false"
  LIVE_TRADING_ENABLED: "false"
  PRIVATE_BINANCE_API_ENABLED: "false"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    name: Format, lint, type, unit, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          make toolchain-bootstrap
          python -m pip install -r backend/requirements.txt
          npm ci --prefix frontend
      - name: Check dependency lock drift
        run: make lock-check
      - name: Run repository quality gate
        run: make quality

  database:
    name: Local Supabase migrations, Auth, and RLS
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: supabase/setup-cli@fddb7422b02b03c9cd4d91251bcd4b5438773777
        with:
          version: 2.101.0
      - name: Install locked backend dependencies
        run: |
          make toolchain-bootstrap
          python -m pip install -r backend/requirements.txt
      - name: Start local Supabase
        run: supabase start
      - name: Reset, migrate, and seed local database
        run: make local-reset
      - name: Verify Alembic compatibility head
        run: make alembic-upgrade
      - name: Run migration, transaction, workspace, and RLS tests
        run: make database-test
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  windows-quality:
    name: Windows command parity
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          .\tasks.ps1 toolchain-bootstrap
          python -m pip install -r backend/requirements.txt
          npm.cmd ci --prefix frontend
      - name: Run repository quality gate
        run: .\tasks.ps1 quality
      - name: Verify native failure propagation
        shell: pwsh
        run: |
          $failedAsExpected = $false
          try {
            .\tasks.ps1 self-test
          } catch {
            $failedAsExpected = $true
            Write-Host "Expected failure propagated: $($_.Exception.Message)"
            $global:LASTEXITCODE = 0
          }
          if (-not $failedAsExpected) {
            throw "Expected self-test to fail"
          }
          Write-Host "Native failure propagation verified."

  security:
    name: Static and dependency security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          make toolchain-bootstrap
          python -m pip install -r backend/requirements.txt
          npm ci --prefix frontend
      - name: Run repository security commands
        run: |
          make security-test
          make frontend-audit

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: 8.30.1

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Review dependency changes
        id: dependency-review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
      - name: Run deterministic fallback dependency audits
        if: steps.dependency-review.outcome == 'failure'
        run: |
          echo "::warning::GitHub dependency review was unavailable or failed; running full locked dependency audits."
          make toolchain-bootstrap
          python -m pip install -r backend/requirements.txt
          npm ci --prefix frontend
          make security-test
          make frontend-audit

  documentation:
    name: Documentation links and task consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Run repository documentation checks
        run: make docs-check
