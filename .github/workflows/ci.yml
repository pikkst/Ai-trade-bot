name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-lint-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install -r requirements.txt
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Format check
        run: make format-check
      - name: Lint
        run: make lint
      - name: Type check
        run: make type-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install -r requirements.txt
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Run tests
        run: make test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Lint
        run: cd frontend && npm run lint
      - name: Build
        run: make frontend-build
      - name: Frontend test
        run: make frontend-test

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check README structure matches implementation
        run: make docs-check

  bootstrap-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Run bootstrap
        run: make bootstrap
      - name: Verify .env files created
        run: |
          test -f .env.local || { echo "FAIL: .env.local not created"; exit 1; }
          test -f .env.test || { echo "FAIL: .env.test not created"; exit 1; }
      - name: Verify bootstrap is idempotent (second run)
        run: make bootstrap
      - name: Run all-checks
        run: make all-checks

  windows-commands:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install pip-tools
        run: |
          cd backend
          python -m pip install pip-tools
      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install -r requirements.txt
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Command help
        run: .\tasks.ps1 help
      - name: Docs check
        run: .\tasks.ps1 docs-check
      - name: Format check
        run: .\tasks.ps1 format-check
      - name: Lint
        run: .\tasks.ps1 lint
      - name: Type check
        run: .\tasks.ps1 type-check
      - name: Frontend test
        run: .\tasks.ps1 frontend-test
      - name: Research cycle smoke
        run: .\tasks.ps1 research-cycle
      - name: Full pre-push gate (all-checks)
        run: .\tasks.ps1 all-checks
      - name: Verify failure propagation (intentional failure)
        run: |
          .\tasks.ps1 docs-check
          if ($LASTEXITCODE -ne 0) { Write-Host "PASS: Non-zero exit code propagated" -ForegroundColor Green }
          else { Write-Host "FAIL: Non-zero exit code not propagated" -ForegroundColor Red; exit 1 }