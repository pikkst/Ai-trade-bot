name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-lint-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install pip-tools for lock check
        run: |
          cd backend
          python -m pip install pip-tools
      - name: Lock drift check
        run: |
          cd backend
          python -m piptools compile --extra=dev --output-file=/tmp/requirements_check.txt pyproject.toml 2>/dev/null
          # Strip comment lines (header) before comparing
          grep -v "^#" requirements.txt | grep -v "^$" > /tmp/req_committed.txt || true
          grep -v "^#" /tmp/requirements_check.txt | grep -v "^$" > /tmp/req_generated.txt || true
          diff /tmp/req_committed.txt /tmp/req_generated.txt || { echo "ERROR: requirements.txt is not up to date. Run make lock under Python 3.12."; exit 1; }
      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install -r requirements.txt
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Format check
        run: make format-check
      - name: Lint
        run: make lint
      - name: Type check
        run: make type-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install -r requirements.txt
      - name: Run tests
        run: make test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Lint
        run: cd frontend && npm run lint
      - name: Build
        run: make frontend-build
      - name: Frontend test
        run: make frontend-test

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check README structure matches implementation
        run: make docs-check

  bootstrap-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Run bootstrap
        run: make bootstrap
      - name: Verify .env files created
        run: |
          test -f .env.local || { echo "FAIL: .env.local not created"; exit 1; }
          test -f .env.test || { echo "FAIL: .env.test not created"; exit 1; }
      - name: Verify bootstrap preserves existing env files (idempotent)
        run: |
          hash1=$(md5sum .env.local | awk '{print $1}')
          hash2=$(md5sum .env.test | awk '{print $1}')
          make bootstrap
          hash1b=$(md5sum .env.local | awk '{print $1}')
          hash2b=$(md5sum .env.test | awk '{print $1}')
          if [ "$hash1" != "$hash1b" ]; then echo "FAIL: .env.local was overwritten"; exit 1; fi
          if [ "$hash2" != "$hash2b" ]; then echo "FAIL: .env.test was overwritten"; exit 1; fi
          echo "PASS: .env.local and .env.test preserved"
      - name: Run all-checks
        run: make all-checks

  bootstrap-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Run bootstrap
        run: .\tasks.ps1 bootstrap
      - name: Verify .env files created
        run: |
          if (-not (Test-Path ".env.local")) { Write-Host "FAIL: .env.local not created" -ForegroundColor Red; exit 1 }
          if (-not (Test-Path ".env.test")) { Write-Host "FAIL: .env.test not created" -ForegroundColor Red; exit 1 }
      - name: Verify bootstrap preserves existing env files (idempotent)
        run: |
          $hash1 = Get-FileHash ".env.local"
          $hash2 = Get-FileHash ".env.test"
          .\tasks.ps1 bootstrap
          $hash1b = Get-FileHash ".env.local"
          $hash2b = Get-FileHash ".env.test"
          if ($hash1.Hash -ne $hash1b.Hash) { Write-Host "FAIL: .env.local was overwritten" -ForegroundColor Red; exit 1 }
          if ($hash2.Hash -ne $hash2b.Hash) { Write-Host "FAIL: .env.test was overwritten" -ForegroundColor Red; exit 1 }
          Write-Host "PASS: .env.local and .env.test preserved" -ForegroundColor Green
      - name: Run all-checks
        run: .\tasks.ps1 all-checks
      - name: Verify failure propagation (intentional failing command)
        shell: bash
        run: |
          pwsh -NoProfile -Command '$ErrorActionPreference = "Stop"
          function Invoke-Native {
              param([string]$Name, [Parameter(ValueFromRemainingArguments = $true)] [string[]]$Arguments)
              try {
                  & $Name @Arguments
                  if ($LASTEXITCODE -ne 0) { throw "Command failed with exit code $LASTEXITCODE" }
              } finally {}
          }
          $caught = $false
          try { Invoke-Native cmd /c exit 1 } catch { $caught = $true }
          if (-not $caught) { Write-Host "FAIL: Invoke-Native did not throw on failure"; exit 1 }
          Write-Host "PASS: Non-zero exit code propagated"'
          if [ $? -eq 0 ]; then echo "PASS: Non-zero exit code propagated"; else echo "FAIL: Non-zero exit code not propagated"; exit 1; fi

  windows-commands:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install pip-tools for lock generation
        run: |
          cd backend
          python -m pip install pip-tools
      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install -r requirements.txt
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Command help
        run: .\tasks.ps1 help
      - name: Lint
        run: .\tasks.ps1 lint
      - name: Type check
        run: .\tasks.ps1 type-check
      - name: Frontend test
        run: .\tasks.ps1 frontend-test
      - name: Research cycle smoke
        run: .\tasks.ps1 research-cycle
      - name: Docs check
        run: .\tasks.ps1 docs-check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install -r requirements.txt
      - name: Run security tests
        run: make security-test