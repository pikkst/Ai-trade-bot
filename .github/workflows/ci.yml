name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-lint-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install pip-tools for lock check
        run: |
          cd backend
          python -m pip install -r requirements.txt
      - name: Lock drift check
        run: |
          cd backend
          cp requirements.txt /tmp/requirements_original.txt
          trap 'cp /tmp/requirements_original.txt requirements.txt' EXIT
          python -m piptools compile --extra=dev --output-file=requirements.txt pyproject.toml
          python ../infrastructure/scripts/normalize_python_lock.py requirements.txt
          if ! git diff --exit-code -- requirements.txt; then
            echo "ERROR: requirements.txt is not up to date. Run make lock under Python 3.12."
            exit 1
          fi
      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install -r requirements.txt
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Format check
        run: make format-check
      - name: Lint
        run: make lint
      - name: Type check
        run: make type-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install -r requirements.txt
      - name: Run tests
        run: make test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Lint
        run: cd frontend && npm run lint
      - name: Build
        run: make frontend-build
      - name: Frontend test
        run: make frontend-test

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check README structure matches implementation
        run: make docs-check

  bootstrap-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Run bootstrap
        run: make bootstrap
      - name: Verify .env files created
        run: |
          test -f .env.local || { echo "FAIL: .env.local not created"; exit 1; }
          test -f .env.test || { echo "FAIL: .env.test not created"; exit 1; }
      - name: Verify bootstrap preserves existing env files (idempotent)
        run: |
          hash1=$(md5sum .env.local | awk '{print $1}')
          hash2=$(md5sum .env.test | awk '{print $1}')
          make bootstrap
          hash1b=$(md5sum .env.local | awk '{print $1}')
          hash2b=$(md5sum .env.test | awk '{print $1}')
          if [ "$hash1" != "$hash1b" ]; then echo "FAIL: .env.local was overwritten"; exit 1; fi
          if [ "$hash2" != "$hash2b" ]; then echo "FAIL: .env.test was overwritten"; exit 1; fi
          echo "PASS: .env.local and .env.test preserved"
      - name: Run all-checks
        run: make all-checks

  bootstrap-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Run bootstrap
        run: .\tasks.ps1 bootstrap
      - name: Verify .env files created
        run: |
          if (-not (Test-Path ".env.local")) { Write-Host "FAIL: .env.local not created" -ForegroundColor Red; exit 1 }
          if (-not (Test-Path ".env.test")) { Write-Host "FAIL: .env.test not created" -ForegroundColor Red; exit 1 }
      - name: Verify bootstrap preserves existing env files (idempotent)
        run: |
          $hash1 = Get-FileHash ".env.local"
          $hash2 = Get-FileHash ".env.test"
          .\tasks.ps1 bootstrap
          $hash1b = Get-FileHash ".env.local"
          $hash2b = Get-FileHash ".env.test"
          if ($hash1.Hash -ne $hash1b.Hash) { Write-Host "FAIL: .env.local was overwritten" -ForegroundColor Red; exit 1 }
          if ($hash2.Hash -ne $hash2b.Hash) { Write-Host "FAIL: .env.test was overwritten" -ForegroundColor Red; exit 1 }
          Write-Host "PASS: .env.local and .env.test preserved" -ForegroundColor Green
      - name: Run all-checks
        run: .\tasks.ps1 all-checks
      - name: Verify failure propagation (intentional failing command)
        shell: bash
        run: |
          set +e
          pwsh -NoProfile -ExecutionPolicy Bypass -File ".\tasks.ps1" self-test 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ]; then echo "PASS: Non-zero exit code propagated through Invoke-Native"; else echo "FAIL: Non-zero exit code not propagated"; exit 1; fi

  windows-commands:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install -r requirements.txt
      - name: Windows lock drift check
        run: |
          Copy-Item backend/requirements.txt "$env:RUNNER_TEMP/requirements-original.txt"
          try {
            .\tasks.ps1 lock
            git diff --exit-code -- backend/requirements.txt
            if ($LASTEXITCODE -ne 0) {
              Write-Host "ERROR: requirements.txt is not up to date for Windows. Run .\tasks.ps1 lock under Python 3.12." -ForegroundColor Red
              exit 1
            }
          } finally {
            Copy-Item "$env:RUNNER_TEMP/requirements-original.txt" backend/requirements.txt -Force
          }
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Command help
        run: .\tasks.ps1 help
      - name: Lint
        run: .\tasks.ps1 lint
      - name: Type check
        run: .\tasks.ps1 type-check
      - name: Frontend test
        run: .\tasks.ps1 frontend-test
      - name: Research cycle smoke
        run: .\tasks.ps1 research-cycle
      - name: Docs check
        run: .\tasks.ps1 docs-check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install -r requirements.txt
      - name: Run security tests
        run: make security-test
      - name: Run frontend dependency audit
        run: |
          cd frontend
          npm audit --audit-level=moderate
