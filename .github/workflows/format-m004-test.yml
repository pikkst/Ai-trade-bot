name: Format M004 accessibility test

on:
  push:
    branches:
      - feat/m004-frontend-foundation

permissions:
  contents: write

jobs:
  format-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out M004 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/m004-frontend-foundation

      - name: Set up locked Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend

      - name: Format accessibility test
        run: npx --prefix frontend prettier --write frontend/src/tests/app.test.tsx

      - name: Commit formatted test
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/tests/app.test.tsx; then
            echo "Accessibility test is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/tests/app.test.tsx
          git commit -m "style(m004): format accessibility test"
          git push origin HEAD:feat/m004-frontend-foundation
